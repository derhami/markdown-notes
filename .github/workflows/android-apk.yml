name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run lint
          npm test

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Install the SDK directly: the setup-android action fails on current
      # runners before Gradle is reached.
      - name: Install Android command-line tools
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TOOL_CACHE/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      # Everything that can fail is kept in one step so the diagnostics below
      # always run, even when the SDK install itself is the problem.
      - name: Install SDK and assemble debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "JAVA_HOME=$JAVA_HOME"
            java -version
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
            fi
            echo "sdkmanager=$SDKMANAGER"
            (yes | "$SDKMANAGER" --licenses) || true
            (yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools") || true
            test -d "$ANDROID_HOME/platforms/android-36"
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee /tmp/build.log

      # Job logs need authentication; annotations are public, so the tail of
      # the failing log is emitted as an annotation as well.
      - name: Publish build diagnostics
        if: always()
        run: |
          {
            echo '### APK build output'
            echo '```'
            tail -n 120 /tmp/build.log 2>/dev/null || echo 'no log captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/build.log ]; then
            grep -nE 'FAILURE|error:|Error|Could not|Exception|What went wrong|failed' /tmp/build.log \
              | tail -n 8 \
              | while IFS= read -r line; do
                  echo "::error::$(printf '%s' "$line" | cut -c1-700)"
                done
          else
            echo '::error::no build log was captured'
          fi
          test "${{ steps.build.outcome }}" = "success"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: markdown-notes-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
