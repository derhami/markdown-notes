name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run lint
          npm test

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Everything that can fail is kept in one step so the diagnostics below
      # always run, even when the SDK install itself is the problem.
      - name: Install SDK and assemble debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "JAVA_HOME=$JAVA_HOME"
            command -v sdkmanager || echo 'sdkmanager not on PATH'
            java -version
            yes | sdkmanager --licenses
            sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee /tmp/build.log

      # Job logs need authentication; the summary is visible on the public run.
      - name: Publish build diagnostics
        if: always()
        run: |
          {
            echo '### APK build output'
            echo '```'
            tail -n 120 /tmp/build.log 2>/dev/null || echo 'no log captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${{ steps.build.outcome }}" = "success"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: markdown-notes-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
