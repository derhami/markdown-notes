name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run lint
          npm test

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Everything that can fail is kept in one step so the diagnostics below
      # always run, even when the SDK install itself is the problem.
      - name: Install SDK and assemble debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "JAVA_HOME=$JAVA_HOME"
            java -version
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
            fi
            echo "sdkmanager=$SDKMANAGER"
            yes | "$SDKMANAGER" --licenses
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          } 2>&1 | tee /tmp/build.log

      # Job logs need authentication; annotations are public, so the tail of
      # the failing log is emitted as an annotation as well.
      - name: Publish build diagnostics
        if: always()
        run: |
          {
            echo '### APK build output'
            echo '```'
            tail -n 120 /tmp/build.log 2>/dev/null || echo 'no log captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/build.log ]; then
            MESSAGE=$(tail -n 40 /tmp/build.log | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-6000)
            echo "::error title=APK build log::${MESSAGE}"
          fi
          test "${{ steps.build.outcome }}" = "success"

      # A public, unauthenticated copy of the failing log so it can be read
      # without repository admin rights.
      - name: Publish failure log to a branch
        if: always() && steps.build.outcome != 'success'
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "ci-logger"
          git config --global user.email "ci-logger@users.noreply.github.com"
          cd "$RUNNER_TEMP"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" logrepo
          cd logrepo
          cp /tmp/build.log apk-build-error.log
          git checkout -b "ci-log-${GITHUB_RUN_ID}"
          git add apk-build-error.log
          git commit -m "APK build log for run ${GITHUB_RUN_ID}"
          git push origin "ci-log-${GITHUB_RUN_ID}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: markdown-notes-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
