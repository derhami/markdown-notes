// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        // Pin Google's Maven to maven.google.com which resolves to genuine Google IPs
        // (dl.google.com can be intercepted by some networks with a mismatched cert)
        maven { url 'https://maven.google.com' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // Local mirror for artifacts that the flaky network intermittently 404s on
        maven { url 'file:///C:/Users/Hamid/AppData/Local/Temp/opencode/android-m2' }
        google()
        maven { url 'https://maven.google.com' }
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
